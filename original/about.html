<script>
(function () {
  const root = document.querySelector('[data-cursor-root]');
  const dot = document.querySelector('[data-cursor-dot]');
  const ring = document.querySelector('[data-cursor-ring]');
  const follow = document.querySelector('[data-cursor-follow]');
  if (!root || !dot || !ring || !follow) return;

  const HOVER_SELECTOR = 'a, button, [role="button"], [data-cursor-hover]';

  let mouseX = 0, mouseY = 0;
  let mainX = 0, mainY = 0;
  let followX = 0, followY = 0;
  let started = false;
  let currentTheme = null;

  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (!started) {
      mainX = followX = mouseX;
      mainY = followY = mouseY;
      started = true;
    }

    const el = document.elementFromPoint(mouseX, mouseY);
    const themedAncestor = el ? el.closest('[data-cursor-theme]') : null;
    if (themedAncestor) {
      const theme = themedAncestor.getAttribute('data-cursor-theme');
      if (theme !== currentTheme) {
        currentTheme = theme;
        root.classList.toggle('theme-dark', theme === 'dark');
        root.classList.toggle('theme-light', theme === 'light');
      }
    }
  });

  document.addEventListener('mouseover', (e) => {
    if (e.target.closest(HOVER_SELECTOR)) root.classList.add('is-hover');
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest(HOVER_SELECTOR)) root.classList.remove('is-hover');
  });

  function lerp(a, b, n) { return a + (b - a) * n; }

  function raf() {
    if (started) {
      mainX = lerp(mainX, mouseX, 0.22);
      mainY = lerp(mainY, mouseY, 0.22);
      followX = lerp(followX, mainX, 0.10);
      followY = lerp(followY, mainY, 0.10);

      const mainT = 'translate3d(' + mainX + 'px,' + mainY + 'px,0) translate(-50%,-50%)';
      dot.style.transform = mainT;
      ring.style.transform = mainT;
      follow.style.transform = 'translate3d(' + followX + 'px,' + followY + 'px,0) translate(-50%,-50%)';
    }
    requestAnimationFrame(raf);
  }
  requestAnimationFrame(raf);
})();
</script>

<script>
// Spinning Text — lay the ring's text out around a circle. The CSS does the
// spinning (one keyframe); this file only positions the characters: each
// <span> gets a --index, and the ring gets a --total, which the stylesheet
// turns into an angle. Scoped to this gem's root so it can't touch the page.
window.addEventListener("DOMContentLoaded", () => {
  const root = document.querySelector(".byq-gem--spinning-text-01");
  if (!root) return;

  const NS = "byq-gem--spinning-text-01";

  root.querySelectorAll(`.${NS}__ring`).forEach((ring) => {
    const chars = [...(ring.dataset.spin || "")];
    ring.style.setProperty("--total", chars.length);

    const frag = document.createDocumentFragment();
    chars.forEach((ch, i) => {
      const span = document.createElement("span");
      span.className = `${NS}__char`;
      span.style.setProperty("--index", i);
      // keep spaces from collapsing so spacing stays even
      span.textContent = ch === " " ? " " : ch;
      frag.appendChild(span);
    });
    ring.appendChild(frag);
  });
});

</script>

<script>
function initDynamicCurrentTime() {
  const defaultTimezone = "America/New_York";

  // Helper function to format numbers with leading zero
  const formatNumber = (number) => number.toString().padStart(2, '0');

  // Function to create a time formatter with the correct timezone
  const createFormatter = (timezone) => {
    return new Intl.DateTimeFormat([], {
      timeZone: timezone,
      timeZoneName: 'short',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false, // Optional: Remove to match your simpler script
    });
  };

  // Function to parse the formatted string into parts
  const parseFormattedTime = (formattedDateTime) => {
    const match = formattedDateTime.match(/(\d+):(\d+):(\d+)\s*([\w+]+)/);
    if (match) {
      return {
        hours: match[1],
        minutes: match[2],
        seconds: match[3],
        timezone: match[4], // Handles both GMT+X and CET cases
      };
    }
    return null;
  };

  // Function to update the time for all elements
  const updateTime = () => {
    document.querySelectorAll('[data-current-time]').forEach((element) => {
      const timezone = element.getAttribute('data-current-time') || defaultTimezone;
      const formatter = createFormatter(timezone);
      const now = new Date();
      const formattedDateTime = formatter.format(now);

      const timeParts = parseFormattedTime(formattedDateTime);
      if (timeParts) {
        const {
          hours,
          minutes,
          seconds,
          timezone
        } = timeParts;

        // Update child elements if they exist
        const hoursElem = element.querySelector('[data-current-time-hours]');
        const minutesElem = element.querySelector('[data-current-time-minutes]');
        const secondsElem = element.querySelector('[data-current-time-seconds]');
        const timezoneElem = element.querySelector('[data-current-time-timezone]');

        if (hoursElem) hoursElem.textContent = hours;
        if (minutesElem) minutesElem.textContent = minutes;
        if (secondsElem) secondsElem.textContent = seconds;
        if (timezoneElem) timezoneElem.textContent = timezone;
      }
    });
  };

  // Initial update and interval for subsequent updates
  updateTime();
  setInterval(updateTime, 1000);
}

// Initialize Dynamic Current Time
document.addEventListener('DOMContentLoaded', () => {
  initDynamicCurrentTime();
});
</script>

<script>
gsap.registerPlugin(ScrollTrigger, SplitText)
  
function initHighlightText(){

  let splitHeadingTargets = document.querySelectorAll("[data-highlight-text]")
  splitHeadingTargets.forEach((heading) => {
    
    const scrollStart = heading.getAttribute("data-highlight-scroll-start") || "top 90%"
    const scrollEnd = heading.getAttribute("data-highlight-scroll-end") || "center 40%"
    const fadedValue = heading.getAttribute("data-highlight-fade") || 0.2 // Opacity of letter
    const staggerValue =  heading.getAttribute("data-highlight-stagger") || 0.1 // Smoother reveal
    
    new SplitText(heading, {
      type: "words, chars",
      autoSplit: true,
      onSplit(self) {
        let ctx = gsap.context(() => {
          let tl = gsap.timeline({
            scrollTrigger: {
              scrub: true,
              trigger: heading, 
              start: scrollStart,
              end: scrollEnd,
            }
          })
          tl.from(self.chars,{
            autoAlpha: fadedValue,
            stagger: staggerValue,
            ease: "linear"
          })
        });
        return ctx; // return our animations so GSAP can clean them up when onSplit fires
      }
    });    
  });
}

// Initialize Highlight Text on Scroll
document.addEventListener("DOMContentLoaded", () =>{
  initHighlightText();
});
</script>

<script>
function initCascadingSlider() {

  const duration = 0.65;
  const ease = 'power3.inOut';

  const breakpoints = [
    { maxWidth: 479, activeWidth: 0.78, siblingWidth: 0.08 },
    { maxWidth: 767, activeWidth: 0.70, siblingWidth: 0.10 },
    { maxWidth: 991, activeWidth: 0.60, siblingWidth: 0.10 },
    { maxWidth: Infinity, activeWidth: 0.60, siblingWidth: 0.13 },
  ];

  const wrappers = document.querySelectorAll('[data-cascading-slider-wrap]');
  wrappers.forEach(setupInstance);

  function setupInstance(wrapper) {
    const viewport = wrapper.querySelector('[data-cascading-viewport]');
    const prevButton = wrapper.querySelector('[data-cascading-slider-prev]');
    const nextButton = wrapper.querySelector('[data-cascading-slider-next]');
    const slides = Array.from(viewport.querySelectorAll('[data-cascading-slide]'));
    let totalSlides = slides.length;

    if (totalSlides === 0) return;

    if (totalSlides < 9) {
      const originalSlides = slides.slice();
      while (slides.length < 9) {
        originalSlides.forEach(function(original) {
          const clone = original.cloneNode(true);
          clone.setAttribute('data-clone', '');
          viewport.appendChild(clone);
          slides.push(clone);
        });
      }
      totalSlides = slides.length;
    }

    let activeIndex = 0;
    let isAnimating = false;
    let slideWidth = 0;
    let slotCenters = {};
    let slotWidths = {};

    function readGap() {
      const raw = getComputedStyle(viewport).getPropertyValue('--gap').trim();
      if (!raw) return 0;
      const temp = document.createElement('div');
      temp.style.width = raw;
      temp.style.position = 'absolute';
      temp.style.visibility = 'hidden';
      viewport.appendChild(temp);
      const px = temp.offsetWidth;
      viewport.removeChild(temp);
      return px;
    }

    function getSettings() {
      const windowWidth = window.innerWidth;
      for (let i = 0; i < breakpoints.length; i++) {
        if (windowWidth <= breakpoints[i].maxWidth) return breakpoints[i];
      }
      return breakpoints[breakpoints.length - 1];
    }

    function getOffset(slideIndex, fromIndex) {
      if (fromIndex === undefined) fromIndex = activeIndex;
      let distance = slideIndex - fromIndex;
      const half = totalSlides / 2;
      if (distance > half) distance -= totalSlides;
      if (distance < -half) distance += totalSlides;
      return distance;
    }

    function measure() {
      const settings = getSettings();
      const viewportWidth = viewport.offsetWidth;
      const gap = readGap();

      const activeSlideWidth = viewportWidth * settings.activeWidth;
      const siblingSlideWidth = viewportWidth * settings.siblingWidth;
      const farSlideWidth = Math.max(0, (viewportWidth - activeSlideWidth - 2 * siblingSlideWidth - 4 * gap) / 2);

      slideWidth = activeSlideWidth;

      const visibleSlots = [
        { slot: -2, width: farSlideWidth },
        { slot: -1, width: siblingSlideWidth },
        { slot: 0, width: activeSlideWidth },
        { slot: 1, width: siblingSlideWidth },
        { slot: 2, width: farSlideWidth },
      ];

      let x = 0;
      visibleSlots.forEach(function(def, i) {
        slotCenters[String(def.slot)] = x + def.width / 2;
        slotWidths[String(def.slot)] = def.width;
        if (i < visibleSlots.length - 1) x += def.width + gap;
      });

      slotCenters['-3'] = slotCenters['-2'] - farSlideWidth / 2 - gap - farSlideWidth / 2;
      slotWidths['-3'] = farSlideWidth;
      slotCenters['3'] = slotCenters['2'] + farSlideWidth / 2 + gap + farSlideWidth / 2;
      slotWidths['3'] = farSlideWidth;

      slides.forEach(function(slide) {
        slide.style.width = slideWidth + 'px';
      });
    }

    function getSlideProps(offset) {
      const clamped = Math.max(-3, Math.min(3, offset));
      const slotWidth = slotWidths[String(clamped)];
      const clipAmount = Math.max(0, (slideWidth - slotWidth) / 2);
      const translateX = slotCenters[String(clamped)] - slideWidth / 2;

      return {
        x: translateX,
        '--clip': clipAmount,
        zIndex: 10 - Math.abs(clamped),
      };
    }

    function layout(animate, previousIndex) {
      slides.forEach(function(slide, index) {
        const offset = getOffset(index);

        if (offset < -3 || offset > 3) {
          if (animate && previousIndex !== undefined) {
            const previousOffset = getOffset(index, previousIndex);
            if (previousOffset >= -2 && previousOffset <= 2) {
              const exitSlot = previousOffset < 0 ? -3 : 3;
              gsap.to(slide, Object.assign({}, getSlideProps(exitSlot), {
                duration: duration,
                ease: ease,
                overwrite: true,
              }));
              return;
            }
          }

          const parkSlot = offset < 0 ? -3 : 3;
          gsap.set(slide, getSlideProps(parkSlot));
          return;
        }

        const props = getSlideProps(offset);
        slide.setAttribute('data-status', offset === 0 ? 'active' : 'inactive');

        if (animate) {
          gsap.to(slide, Object.assign({}, props, {
            duration: duration,
            ease: ease,
            overwrite: true,
          }));
        } else {
          gsap.set(slide, props);
        }
      });
    }

    function goTo(targetIndex) {
      const normalizedTarget = ((targetIndex % totalSlides) + totalSlides) % totalSlides;
      if (isAnimating || normalizedTarget === activeIndex) return;
      isAnimating = true;

      const previousIndex = activeIndex;
      const travelDirection = getOffset(normalizedTarget, previousIndex) > 0 ? 1 : -1;

      slides.forEach(function(slide, index) {
        const currentOffset = getOffset(index, previousIndex);
        const nextOffset = getOffset(index, normalizedTarget);
        const wasInRange = currentOffset >= -3 && currentOffset <= 3;
        const willBeVisible = nextOffset >= -2 && nextOffset <= 2;

        if (!wasInRange && willBeVisible) {
          const entrySlot = travelDirection > 0 ? 3 : -3;
          gsap.set(slide, getSlideProps(entrySlot));
        }

        const wasInvisible = Math.abs(currentOffset) >= 3;
        const willBeStaging = Math.abs(nextOffset) === 3;
        const crossesSides = currentOffset * nextOffset < 0;
        if (wasInvisible && willBeStaging && crossesSides) {
          gsap.set(slide, getSlideProps(nextOffset > 0 ? 3 : -3));
        }
      });

      activeIndex = normalizedTarget;
      layout(true, previousIndex);
      gsap.delayedCall(duration + 0.05, function() { isAnimating = false; });
    }

    if (prevButton) prevButton.addEventListener('click', function() { goTo(activeIndex - 1); });
    if (nextButton) nextButton.addEventListener('click', function() { goTo(activeIndex + 1); });

    slides.forEach(function(slide, index) {
      slide.addEventListener('click', function() {
        if (index !== activeIndex) goTo(index);
      });
    });

    document.addEventListener('keydown', function(event) {
      if (event.key === 'ArrowLeft') goTo(activeIndex - 1);
      if (event.key === 'ArrowRight') goTo(activeIndex + 1);
    });

    let resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        measure();
        layout(false);
      }, 100);
    });

    measure();
    layout(false);
  }
}

// Initialize Cascading Slider
document.addEventListener('DOMContentLoaded', function() {
  initCascadingSlider();
});
</script>

    });
  });
});

<script>
gsap.registerPlugin(ScrollTrigger);

function initGlobalParallax() {
  const mm = gsap.matchMedia()

  mm.add(
    {
      isMobile: "(max-width:479px)",
      isMobileLandscape: "(max-width:767px)",
      isTablet: "(max-width:991px)",
      isDesktop: "(min-width:992px)"
    },
    (context) => {
      const { isMobile, isMobileLandscape, isTablet } = context.conditions

      const ctx = gsap.context(() => {
        document.querySelectorAll('[data-parallax="trigger"]').forEach((trigger) => {
            // Check if this trigger has to be disabled on smaller breakpoints
            const disable = trigger.getAttribute("data-parallax-disable")
            if (
              (disable === "mobile" && isMobile) ||
              (disable === "mobileLandscape" && isMobileLandscape) ||
              (disable === "tablet" && isTablet)
            ) {
              return
            }
            
            // Optional: you can target an element inside a trigger if necessary 
            const target = trigger.querySelector('[data-parallax="target"]') || trigger

            // Get the direction value to decide between xPercent or yPercent tween
            const direction = trigger.getAttribute("data-parallax-direction") || "vertical"
            const prop = direction === "horizontal" ? "xPercent" : "yPercent"
            
            // Get the scrub value, our default is 'true' because that feels nice with Lenis
            const scrubAttr = trigger.getAttribute("data-parallax-scrub")
            const scrub = scrubAttr ? parseFloat(scrubAttr) : true
            
            // Get the start position in % 
            const startAttr = trigger.getAttribute("data-parallax-start")
            const startVal = startAttr !== null ? parseFloat(startAttr) : 20
            
            // Get the end position in %
            const endAttr = trigger.getAttribute("data-parallax-end")
            const endVal = endAttr !== null ? parseFloat(endAttr) : -20
            
            // Get the start value of the ScrollTrigger
            const scrollStartRaw = trigger.getAttribute("data-parallax-scroll-start") || "top bottom"
            const scrollStart = `clamp(${scrollStartRaw})`
            
           // Get the end value of the ScrollTrigger  
            const scrollEndRaw = trigger.getAttribute("data-parallax-scroll-end") || "bottom top"
            const scrollEnd = `clamp(${scrollEndRaw})`

            gsap.fromTo(
              target,
              { [prop]: startVal },
              {
                [prop]: endVal,
                ease: "none",
                scrollTrigger: {
                  trigger,
                  start: scrollStart,
                  end: scrollEnd,
                  scrub,
                },
              }
            )
          })
      })

      return () => ctx.revert()
    }
  )
}

// Initialize Global Parallax Setup
document.addEventListener("DOMContentLoaded", () => {
  initGlobalParallax()
});
</script>

<script>
function initArcScrollTransition() {
  gsap.registerPlugin(ScrollTrigger);

  const defaultMode = "cover";
  const defaultScrollStart = { cover: "bottom bottom", reveal: "top bottom" };
  const defaultScrollEnd = { cover: "bottom top", reveal: "top top" };
  const defaultScrub = 0.3;
  const defaultCurve = 12;

  const viewBox = 100;
  const svgNamespace = "http://www.w3.org/2000/svg";

  const instances = [];
  let mm = null;

  function getMode(wrapper) {
    return wrapper.dataset.mode === "reveal" ? "reveal" : defaultMode;
  }

  function getCurve(wrapper) {
    const value = parseFloat(wrapper.dataset.curve);
    return Number.isFinite(value) ? value : defaultCurve;
  }

  function getScrollStart(wrapper, mode) {
    return wrapper.dataset.scrollStart || defaultScrollStart[mode];
  }

  function getScrollEnd(wrapper, mode) {
    return wrapper.dataset.scrollEnd || defaultScrollEnd[mode];
  }

  function round(value) {
    return Math.round(value * 100) / 100;
  }

  function buildShape(wrapper) {
    const shape = document.createElementNS(svgNamespace, "svg");
    shape.setAttribute("data-arc-scroll-shape", "");
    shape.setAttribute("viewBox", `0 0 ${viewBox} ${viewBox}`);
    shape.setAttribute("preserveAspectRatio", "none");
    shape.setAttribute("aria-hidden", "true");

    const path = document.createElementNS(svgNamespace, "path");
    path.setAttribute("data-arc-scroll-path", "");

    shape.appendChild(path);
    wrapper.appendChild(shape);

    return { shape, path };
  }

  function measureSection(instance) {
    const rect = instance.section.getBoundingClientRect();
    const aspect = rect.height ? rect.width / rect.height : 1;
    instance.depth = getCurve(instance.wrapper) * aspect;
  }

  function drawArc(instance, progress) {
    const fill = instance.mode === "cover" ? progress : 1 - progress;
    const curve = instance.depth * Math.sin(fill * Math.PI);

    if (instance.mode === "cover") {
      const edge = round(viewBox - viewBox * fill);
      const control = round(edge - curve * 2);
      instance.path.setAttribute("d", `M0 ${viewBox} L0 ${edge} Q${viewBox / 2} ${control} ${viewBox} ${edge} L${viewBox} ${viewBox} Z`);
      return;
    }

    const edge = round(viewBox * fill);
    const control = round(edge + curve * 2);
    instance.path.setAttribute("d", `M0 0 L0 ${edge} Q${viewBox / 2} ${control} ${viewBox} ${edge} L${viewBox} 0 Z`);
  }

  function createAnimation(instance) {
    const state = { progress: 0 };

    return gsap.to(state, {
      progress: 1,
      ease: "none",
      onUpdate: () => drawArc(instance, state.progress),
      scrollTrigger: {
        trigger: instance.section,
        start: getScrollStart(instance.wrapper, instance.mode),
        end: getScrollEnd(instance.wrapper, instance.mode),
        scrub: defaultScrub,
        invalidateOnRefresh: true,
        onRefresh: () => measureSection(instance),
      },
    });
  }

  function setupInstance(wrapper) {
    const { shape, path } = buildShape(wrapper);

    const instance = {
      wrapper,
      shape,
      path,
      section: wrapper.closest("section") || wrapper.parentElement,
      mode: getMode(wrapper),
      depth: 0,
    };

    measureSection(instance);
    drawArc(instance, 0);
    instance.tween = createAnimation(instance);

    return instance;
  }

  function destroyInstance(instance) {
    instance.tween.scrollTrigger?.kill();
    instance.tween.kill();
    instance.shape.remove();
  }

  function buildAll() {
    const wrappers = document.querySelectorAll("[data-arc-scroll-transition]");
    wrappers.forEach((wrapper) => {
      instances.push(setupInstance(wrapper));
    });
    ScrollTrigger.refresh();
  }

  function destroyAll() {
    instances.forEach(destroyInstance);
    instances.length = 0;
  }

  const wrappers = document.querySelectorAll("[data-arc-scroll-transition]");
  if (!wrappers.length) return;

  mm = gsap.matchMedia();

  mm.add("(prefers-reduced-motion: no-preference)", () => {
    buildAll();

    return () => {
      destroyAll();
    };
  });
}

// Initialize Arc Scroll Transition
document.addEventListener("DOMContentLoaded", () => {
  initArcScrollTransition();
});
</script>

<script>
function init3dPerspectiveHover() {
  // Skip on touch / non-hover devices
  const canHover = window.matchMedia?.('(hover: hover) and (pointer: fine)').matches;
  if (!canHover) return () => {};

  // Skip if there's no targets on page
  const nodeList = document.querySelectorAll('[data-3d-hover-target]');
  if (!nodeList.length) return () => {};
  
  // Skip if user prefers reduced motion
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return () => {};

  const DEFAULT_MAX_DEG = 20;
  const EASE = 'power3.out';
  const DURATION  = 0.5;

  const targets = Array.from(nodeList).map((el) => {
    const maxAttr = parseFloat(el.getAttribute('data-max-rotate'));
    const maxRotate = Number.isFinite(maxAttr) ? maxAttr : DEFAULT_MAX_DEG;

    const setRotationX = gsap.quickSetter(el, 'rotationX', 'deg');
    const setRotationY = gsap.quickSetter(el, 'rotationY', 'deg');

    return {
      el,
      maxRotate,
      rect: el.getBoundingClientRect(),
      proxy: { rx: 0, ry: 0 },
      setRotationX,
      setRotationY,
    };
  });

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let isFrameScheduled = false;

  function measureAll() {
    for (const target of targets) {
      target.rect = target.el.getBoundingClientRect();
    }
  }

  function onPointerMove(event) {
    mouseX = event.clientX;
    mouseY = event.clientY;
    if (!isFrameScheduled) {
      isFrameScheduled = true;
      requestAnimationFrame(updateAll);
    }
  }

  function updateAll() {
    isFrameScheduled = false;

    for (const target of targets) {
      const { rect, maxRotate, proxy, setRotationX, setRotationY } = target;

      const centerX = rect.left + rect.width  / 2;
      const centerY = rect.top  + rect.height / 2;

      const normX = Math.max(-1, Math.min(1, (mouseX - centerX) / ((rect.width  / 2) || 1)));
      const normY = Math.max(-1, Math.min(1, (mouseY - centerY) / ((rect.height / 2) || 1)));

      const rotationY = normX * maxRotate;
      const rotationX = -normY * maxRotate;

      gsap.to(proxy, {
        rx: rotationX,
        ry: rotationY,
        duration: DURATION,
        ease: EASE,
        overwrite: true,
        onUpdate: () => {
          setRotationX(proxy.rx);
          setRotationY(proxy.ry);
        }
      });
    }
  }

  // stable listener so we can remove them later
  function onResize() { requestAnimationFrame(measureAll); }
  function onScroll() { requestAnimationFrame(measureAll); }

  // init
  measureAll();
  document.addEventListener('pointermove', onPointerMove, { passive: true });
  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('scroll', onScroll, { passive: true });

  // expose cleanup
  function destroy() {
    document.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('resize', onResize);
    window.removeEventListener('scroll', onScroll);
  }

  return destroy;
}

// Initialize 3D Perspective Hover
document.addEventListener('DOMContentLoaded', () => {
  init3dPerspectiveHover();
});
</script>

<script>
gsap.registerPlugin(ScrollTrigger, DrawSVGPlugin);

function initDrawPathOnScroll() {
  const mm = gsap.matchMedia();
  const wrappers = document.querySelectorAll("[data-draw-scroll-wrap]");

  mm.add(
    {
      isDesktop: "(min-width: 768px)",
      isMobile: "(max-width: 767px)"
    },
    (context) => {
      const { isDesktop, isMobile } = context.conditions;

      wrappers.forEach((wrap) => {
        // Kill any previous timeline for this wrapper
        if (wrap._drawTl) {
          if (wrap._drawTl.scrollTrigger) {
            wrap._drawTl.scrollTrigger.kill();
          }
          wrap._drawTl.kill();
          wrap._drawTl = null;
        }

        const desktopSVG = wrap.querySelector("[data-draw-scroll-desktop]");
        const mobileSVG  = wrap.querySelector("[data-draw-scroll-mobile]"); // optional

        // default: desktop
        let svgToUse = desktopSVG;

        // on mobile, use mobileSVG if it exists
        if (isMobile && mobileSVG) {
          svgToUse = mobileSVG;
        }

        if (!svgToUse) return;

        const path = svgToUse.querySelector("[data-draw-scroll-path]");
        if (!path) return;

        const tl = gsap.timeline({
          defaults: {
            ease: "linear" // scroll speed controls easing
          },
          scrollTrigger: {
            trigger: wrap,
            start: "clamp(top center)",  // When top of wrap reaches center of viewport
            end: "clamp(top top)", // When bottom of wrap reaches center of viewport
            scrub: true,
            invalidateOnRefresh: true
          }
        });

        tl.fromTo(path,
          { drawSVG: 0 },
          { drawSVG: "100%", duration: 1 }
        );

        // Keep a reference so we can kill it on breakpoint change
        wrap._drawTl = tl;
      });

      // Make sure ScrollTrigger recalculates
      ScrollTrigger.refresh();

      // Cleanup when breakpoint changes
      return () => {
        wrappers.forEach((wrap) => {
          if (wrap._drawTl) {
            if (wrap._drawTl.scrollTrigger) {
              wrap._drawTl.scrollTrigger.kill();
            }
            wrap._drawTl.kill();
            wrap._drawTl = null;
          }
        });
      };
    }
  );
}

// Initialize Draw Path on Scroll
document.addEventListener("DOMContentLoaded", function () {
  initDrawPathOnScroll();
});
</script>
