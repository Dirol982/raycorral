<!--
  RAY CORRAL · ОБЩИЙ КОД САЙТА (Head code)
  Куда: Webflow → Site settings → Custom code → Head code
  Заменяет: два <link> на lenis.css (jsDelivr 1.2.3 и unpkg 1.3.17).
-->

<!-- Ранние соединения с CDN, откуда идут Lenis и Unicorn Studio -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<!-- Стили Lenis 1.3.17 (встроены, вместо двух внешних файлов) -->
<style>
html.lenis,html.lenis body{height:auto}
.lenis:not(.lenis-autoToggle).lenis-stopped{overflow:clip}
.lenis [data-lenis-prevent],.lenis [data-lenis-prevent-wheel],.lenis [data-lenis-prevent-touch]{overscroll-behavior:contain}
.lenis.lenis-smooth iframe{pointer-events:none}
.lenis.lenis-autoToggle{transition-property:overflow;transition-duration:1ms;transition-behavior:allow-discrete}

/* Пользователям с "уменьшить движение" в системе: без бесконечных анимаций */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}
</style>
